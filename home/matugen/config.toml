# Configuration matugen — Material You color generation
# Appelé par set-wallpaper et restore-wallpaper

[config]
mode = "dark"
scheme_type = "scheme-tonal-spot"

# swaybg est appelé MANUELLEMENT dans set-wallpaper (pas via matugen)
# pour garder la cohérence avec restore-wallpaper et ~/.wallpaper

# ── Templates ────────────────────────────────────────────────
[templates.hyprland]
input_path  = "~/.config/matugen/templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors.conf"

[templates.waybar]
input_path  = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"

[templates.fuzzel]
input_path  = "~/.config/matugen/templates/fuzzel.ini"
output_path = "~/.config/fuzzel/fuzzel.ini"

[templates.mako]
input_path  = "~/.config/matugen/templates/mako.ini"
output_path = "~/.config/mako/config"
