# Ghostty — couleurs générées par matugen (Material You)
# Régénéré automatiquement par set-wallpaper / restore-wallpaper

background = {{ colors.surface.default.hex_stripped }}
foreground = {{ colors.on_surface.default.hex_stripped }}
cursor-color = {{ colors.primary.default.hex_stripped }}
cursor-text = {{ colors.surface.default.hex_stripped }}
selection-background = {{ colors.primary.default.hex_stripped }}
selection-foreground = {{ colors.on_primary.default.hex_stripped }}

# Normal colors
palette = 0={{ colors.surface.default.hex_stripped }}
palette = 1={{ colors.error.default.hex_stripped }}
palette = 2={{ colors.tertiary.default.hex_stripped }}
palette = 3={{ colors.secondary.default.hex_stripped }}
palette = 4={{ colors.primary.default.hex_stripped }}
palette = 5={{ colors.tertiary.default.hex_stripped }}
palette = 6={{ colors.secondary.default.hex_stripped }}
palette = 7={{ colors.on_surface.default.hex_stripped }}

# Bright colors
palette = 8={{ colors.outline.default.hex_stripped }}
palette = 9={{ colors.error_container.default.hex_stripped }}
palette = 10={{ colors.on_tertiary_container.default.hex_stripped }}
palette = 11={{ colors.on_secondary_container.default.hex_stripped }}
palette = 12={{ colors.on_primary_container.default.hex_stripped }}
palette = 13={{ colors.on_tertiary_container.default.hex_stripped }}
palette = 14={{ colors.on_secondary_container.default.hex_stripped }}
palette = 15={{ colors.on_surface.default.hex_stripped }}
