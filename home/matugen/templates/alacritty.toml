# Alacritty — couleurs générées par matugen (Material You)
# Régénéré automatiquement par set-wallpaper / restore-wallpaper

[colors.primary]
background = "{{ colors.surface.default.hex }}"
foreground = "{{ colors.on_surface.default.hex }}"

[colors.cursor]
text   = "{{ colors.surface.default.hex }}"
cursor = "{{ colors.primary.default.hex }}"

[colors.vi_mode_cursor]
text   = "{{ colors.surface.default.hex }}"
cursor = "{{ colors.tertiary.default.hex }}"

[colors.selection]
text       = "{{ colors.on_primary.default.hex }}"
background = "{{ colors.primary.default.hex }}"

[colors.search.matches]
foreground = "{{ colors.on_tertiary_container.default.hex }}"
background = "{{ colors.tertiary_container.default.hex }}"

[colors.search.focused_match]
foreground = "{{ colors.on_primary.default.hex }}"
background = "{{ colors.primary.default.hex }}"

[colors.hints.start]
foreground = "{{ colors.on_secondary_container.default.hex }}"
background = "{{ colors.secondary_container.default.hex }}"

[colors.hints.end]
foreground = "{{ colors.on_surface_variant.default.hex }}"
background = "{{ colors.surface_variant.default.hex }}"

# Normal colors (Material You mapped)
[colors.normal]
black   = "{{ colors.surface.default.hex }}"
red     = "{{ colors.error.default.hex }}"
green   = "{{ colors.tertiary.default.hex }}"
yellow  = "{{ colors.secondary.default.hex }}"
blue    = "{{ colors.primary.default.hex }}"
magenta = "{{ colors.tertiary.default.hex }}"
cyan    = "{{ colors.secondary.default.hex }}"
white   = "{{ colors.on_surface.default.hex }}"

# Bright colors
[colors.bright]
black   = "{{ colors.outline.default.hex }}"
red     = "{{ colors.error_container.default.hex }}"
green   = "{{ colors.on_tertiary_container.default.hex }}"
yellow  = "{{ colors.on_secondary_container.default.hex }}"
blue    = "{{ colors.on_primary_container.default.hex }}"
magenta = "{{ colors.on_tertiary_container.default.hex }}"
cyan    = "{{ colors.on_secondary_container.default.hex }}"
white   = "{{ colors.on_surface.default.hex }}"
