# Hyprland Configuration
# NixOS - Structure modulaire inspirée de config Arch
# https://wiki.hyprland.org

# =====================================
# CONFIGURATION MODULES
# =====================================

# Couleurs dynamiques (générées par matugen depuis le wallpaper)
# Ce fichier est créé par set-wallpaper / restore-wallpaper au boot
source = ~/.config/hypr/colors.conf

# Environment
source = ~/.config/hypr/env.conf

# Display
source = ~/.config/hypr/monitors.conf

# Input & Gestures
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/gestures.conf

# Appearance
source = ~/.config/hypr/general.conf
source = ~/.config/hypr/decoration.conf
source = ~/.config/hypr/animations.conf

# Layouts
source = ~/.config/hypr/layouts.conf

# Misc
source = ~/.config/hypr/misc.conf

# Startup Applications
source = ~/.config/hypr/startup.conf

# Keybindings
source = ~/.config/hypr/keybinds.conf

# Window Rules
source = ~/.config/hypr/windowrules.conf

# Tablet (X230t - rotation, stylet Wacom, clavier virtuel)
source = ~/.config/hypr/tablet.conf
