# Input Configuration
# Hyprland - NixOS

input {
    kb_layout = us
    kb_variant = altgr-intl
    numlock_by_default = true

    touchpad {
        tap-to-click = true
        natural_scroll = true
        disable_while_typing = true
    }

    follow_mouse = 1
    mouse_refocus = false
    sensitivity = 0
}
