# Configuration Tablette
# Hyprland - X230 Tablet (Libreboot)
# Digitizer Wacom, ecran tactile, rotation, clavier virtuel

# =====================================
# PERIPHERIQUES TABLETTE
# =====================================

# Digitizer Wacom interne (stylet)
device {
    name = wacom-isdv4-ec-pen
    output = eDP-1
    # Le stylet suit l'ecran interne uniquement
}

# Gomme du stylet Wacom
device {
    name = wacom-isdv4-ec-eraser
    output = eDP-1
}

# Ecran tactile (doigts)
device {
    name = wacom-isdv4-ec-finger
    output = eDP-1
}

# =====================================
# TOUCH (parametres tactiles)
# =====================================

# Activer les gestes tactiles pour le mode tablette
gestures {
    workspace_swipe = true
    workspace_swipe_touch = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 200
    workspace_swipe_cancel_ratio = 0.3
}

# =====================================
# KEYBINDS TABLETTE
# =====================================

$mod = SUPER

# Rotation manuelle de l'ecran (cycle 0 -> 90 -> 180 -> 270 -> 0)
bind = $mod SHIFT, R, exec, rotate-screen

# Toggle clavier virtuel (squeekboard)
bind = $mod SHIFT, K, exec, toggle-vkbd

# =====================================
# WINDOW RULES TABLETTE
# =====================================

# Le clavier virtuel doit rester flottant et au premier plan
windowrulev2 = float, class:^(sm.puri.Squeekboard)$
windowrulev2 = pin, class:^(sm.puri.Squeekboard)$
windowrulev2 = stayfocused, class:^(sm.puri.Squeekboard)$
windowrulev2 = noborder, class:^(sm.puri.Squeekboard)$
windowrulev2 = noshadow, class:^(sm.puri.Squeekboard)$
