# ============================================================================
# Configuration Tablette - ThinkPad X230 Tablet
# ============================================================================
# Hyprland config pour le mode tablette avec Libreboot
# - Rotation écran  
# - Digitizer Wacom
# - Écran tactile
# - Clavier virtuel
# ============================================================================

# ============================================================================
# PÉRIPHÉRIQUES WACOM
# ============================================================================

# Digitizer Wacom (stylet)
device {
    name = wacom-isdv4-e6-pen
}

# Gomme du stylet
device {
    name = wacom-isdv4-e6-eraser
}

# Écran tactile (doigts)
device {
    name = wacom-isdv4-e6-finger
}

# ============================================================================
# KEYBINDS - Raccourcis clavier (Mod+*)
# ============================================================================

$mod = SUPER

# Rotation manuelle écran
bind = $mod SHIFT, R, exec, rotate-screen

# Toggle clavier virtuel
bind = $mod SHIFT, K, exec, toggle-vkbd

# Reset écran orientation normale
bind = $mod SHIFT, O, exec, reset-internal-monitor

# ============================================================================
# SWITCH - Mode tablette ThinkPad X230
# ============================================================================

# Switch mode tablette (pivote l'écran quand on bascule en mode tablette)
bindl = , switch:on:ThinkPad Extra Buttons, exec, rotate-screen
bindl = , switch:off:ThinkPad Extra Buttons, exec, reset-internal-monitor

# Lid switch géré par logind (HandleLidSwitch/HandleLidSwitchDocked dans NixOS config)
# Ne pas utiliser bindl ici car ça bypass les règles logind (docked, external power, etc.)

# ============================================================================
# KEYBINDS - Boutons matériels ThinkPad (XF86 keys)
# ============================================================================

# Boutons bezel -> rotation/clavier
bindl = , XF86Launch1, exec, rotate-screen
bindl = , XF86Launch2, exec, toggle-vkbd
bindl = , XF86ScreenSaver, exec, swaylock -f -c 000000
bindl = , XF86RotationLockToggle, exec, rotate-screen
bindl = , XF86Display, exec, rotate-screen

# ============================================================================
# WINDOW RULES - Clavier virtuel  
# ============================================================================

windowrule = float on, match:class ^(sm.puri.Squeekboard)$
windowrule = pin on, match:class ^(sm.puri.Squeekboard)$
windowrule = border_size 0, match:class ^(sm.puri.Squeekboard)$
windowrule = no_shadow on, match:class ^(sm.puri.Squeekboard)$

