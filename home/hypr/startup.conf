# Startup Applications
# Hyprland - NixOS Config

# Systemd integration
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user start graphical-session.target

# Keyring (géré par PAM + gnome-keyring service)

# Wallpaper + couleurs Material You + barre + notifications
# restore-wallpaper gère tout dans l'ordre :
#   1. matugen génère les couleurs depuis le wallpaper (synchrone)
#   2. swaybg applique le wallpaper
#   3. mako et waybar démarrent avec les couleurs fraîchement générées
exec-once = restore-wallpaper

# System tray applets
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Polkit authentication agent (fallback launch si le service systemd ne s'est pas lancé)
exec-once = systemctl --user start polkit-gnome-authentication-agent-1

# Idle management
exec-once = hypridle

# Clipboard manager (pas de wl-clip-persist, interfère avec la sélection GTK)
exec-once = wl-paste --watch cliphist store

# Auto-mount USB
exec-once = udiskie --tray

# ThinkPad X230 Tablet - monitoring mode tablette (lancé seulement si le fichier existe)
exec-once = [ -f /sys/devices/platform/thinkpad_acpi/hotkey_tablet_mode ] && tablet-mode-monitor
